name: Fetch raw media (exact bytes)

on:
  push:
    branches: [main]
    paths: ['tests/fetch.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p tests/fetch
          python3 - <<'PY'
          import json, urllib.request
          for it in json.load(open("tests/fetch.json")):
              req = urllib.request.Request(it["url"], headers={"User-Agent": "Mozilla/5.0"})
              open("tests/fetch/" + it["name"], "wb").write(urllib.request.urlopen(req, timeout=120).read())
          PY
          ls -la tests/fetch
      - name: Save
        run: |
          git config user.name "fanart-bot"
          git config user.email "fanart-bot@users.noreply.github.com"
          git add tests/fetch
          git commit -qm "fetch [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
