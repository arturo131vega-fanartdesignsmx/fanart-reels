name: Instagram container test (no publish)

on:
  push:
    branches: [main]
    paths: ['tests/igtest.json']

permissions:
  contents: write

jobs:
  igtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 engine/pipeline.py
        env:
          MODE: igtest
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Save result
        run: |
          git config user.name "fanart-bot"
          git config user.email "fanart-bot@users.noreply.github.com"
          git add tests/igtest_result.json
          git commit -qm "igtest result [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
