name: Listing contact sheets

on:
  push:
    branches: [main]
    paths: ['tests/sheets.json']

permissions:
  contents: write

jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy opencv-python-headless pillow
      - run: python3 engine/sheets.py
      - name: Save
        run: |
          git config user.name "fanart-bot"
          git config user.email "fanart-bot@users.noreply.github.com"
          git add tests/sheets
          git commit -qm "sheets [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
